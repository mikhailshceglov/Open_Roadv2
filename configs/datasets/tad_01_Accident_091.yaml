# TAD (Traffic Anomaly Detection), abnormal clip 01_Accident_091.
#
# TAD ships clips as folders of JPEG frames, not video files, so a clip is just
# an unlabelled dataset. Frames are numbered without zero padding, which is why
# frame ordering is natural rather than lexicographic.
#
# Extract from the release archive with:
#   unzip -j tad.zip 'TAD/frames/abnormal/01_Accident_091.mp4/*.jpg' -d data/tad/01_Accident_091

name: tad_01_Accident_091
root: data/tad/01_Accident_091
images_dir: .

# TAD labels clips as normal/abnormal at the clip level; there are no per-pixel
# masks, so there is nothing to evaluate against. These runs produce pictures.
labels_dir: null
