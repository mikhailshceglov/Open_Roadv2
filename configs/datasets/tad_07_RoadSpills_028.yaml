# TAD (Traffic Anomaly Detection), abnormal clip 07_RoadSpills_028.
#
# TAD ships clips as folders of JPEG frames, not video files, so a clip is just
# an unlabelled dataset. Frames are named by index with no zero padding, which
# is why frame ordering is natural rather than lexicographic -- otherwise the
# encoded video runs 0, 1, 10, 100, 11.
#
# Extract from the release archive with:
#   unzip -j tad.zip 'TAD/frames/abnormal/07_RoadSpills_028.mp4/*.jpg' -d data/tad/07_RoadSpills_028

name: tad_07_RoadSpills_028
root: data/tad/07_RoadSpills_028
images_dir: .

# TAD labels clips as normal/abnormal at the clip level; there are no
# per-pixel masks, so there is nothing to evaluate against here. These runs
# produce pictures, not metrics.
labels_dir: null
